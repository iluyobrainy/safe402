name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run publish checks without publishing"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run publish:check
      - name: Publish dry run
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --dry-run
          else
            echo "NPM_TOKEN is not configured. Running unauthenticated dry-run."
            npm publish --dry-run
          fi
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: Publish package with npm token
        if: ${{ inputs.dry_run == 'false' && env.NPM_TOKEN != '' }}
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: Publish package with trusted publishing
        if: ${{ inputs.dry_run == 'false' && env.NPM_TOKEN == '' }}
        run: npm publish --provenance
